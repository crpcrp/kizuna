name: CI

# Release tags are handled by release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fork PRs receive a read-only token and no repository secrets.
permissions:
  contents: read

# Pin third-party actions to immutable SHAs to prevent retagged releases entering CI.
jobs:
  checks:
    # Branch protection requires these check names; keep them stable across runner changes.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            id: windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            id: linux-x64

    steps:
      # Use GITHUB_ENV because job-level env cannot access runner.temp.
      - name: Route npm debug logs to a collectable directory
        shell: bash
        run: echo "npm_config_logs_dir=$RUNNER_TEMP/npm-logs" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Tests use fakes; pinned runtime binaries are staged separately.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential python3 pkg-config

      # Cache the Electron ABI rebuild; exact OS/Node/lock matches only, with no partial restore.
      - name: Restore installed dependencies
        id: node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-v2-${{ matrix.id }}-node-24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save installed dependencies
        if: steps.node_modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.node_modules.outputs.cache-primary-key }}

      # Separate vendor caches by host and lock; bump the generation if unpacking changes.
      - name: Restore pinned binary mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vendor-cache
          key: vendor-v4-${{ matrix.id }}-${{ hashFiles('resources.lock.json') }}

      - name: Fetch and verify runtime binaries from the pinned mirror
        run: npm run resources

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Generate third-party notices
        run: npm run notices

      - name: Build production bundles
        run: npm run build

      # Capture npm logs for failures outside the test runner as well.
      - name: Upload npm debug logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-logs-${{ matrix.id }}
          path: ${{ runner.temp }}/npm-logs
          if-no-files-found: ignore
          retention-days: 7
