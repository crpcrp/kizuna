name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false

      - name: Verify release ref
        id: release
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          build=true
          publish=false

          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != "$tag" ]]; then
              echo "Tag $REF_NAME does not match package.json version $version" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo 'The tagged commit is not in main history' >&2
              exit 1
            fi
            publish=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            previous_version=$(git show "$EVENT_BEFORE:package.json" | jq -r .version)
            if [[ "$previous_version" == "$version" ]]; then
              echo 'package.json changed without a version change; skipping release build'
              build=false
            else
              if [[ "$(jq -r '.version, .packages[""].version' package-lock.json | sort -u)" != "$version" ]]; then
                echo 'package.json and package-lock.json versions do not match' >&2
                exit 1
              fi
              if git rev-parse --verify --quiet "refs/tags/$tag"; then
                echo "Release tag already exists: $tag" >&2
                exit 1
              fi
              publish=true
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build and smoke-test Windows x64
    needs: validate
    if: needs.validate.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Same key generation as ci.yml, so a tag built from a commit CI already
      # ran restores the unpacked payload instead of downloading it again.
      - name: Restore pinned binary mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vendor-cache
          key: vendor-v4-windows-x64-${{ hashFiles('resources.lock.json') }}

      - name: Fetch pinned Windows resources
        run: npm run resources -- --platform win32-x64

      - name: Build unsigned installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run dist
          node scripts/validate-update-metadata.mjs dist/latest.yml "kizuna-$env:VERSION-setup.exe"
          Compress-Archive -Path build\notices\* -DestinationPath "dist\kizuna-$env:VERSION-windows-x64-notices.zip"

      - name: Smoke-test installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem dist\*-setup.exe)[0].FullName
          $installDir = Join-Path $env:RUNNER_TEMP "kizuna-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $appExe = Join-Path $installDir 'kizuna.exe'
          $uninstaller = Join-Path $installDir 'Uninstall Kizuna.exe'

          try {
            $install = Start-Process $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "Installer exited with code $($install.ExitCode)"
            }

            $env:ELECTRON_RUN_AS_NODE = '1'
            $smoke = Start-Process $appExe -Wait -PassThru -NoNewWindow -ArgumentList @(
              (Join-Path $installDir 'resources\app.asar\out\main\smoke.js'),
              (Join-Path $installDir 'resources'))
            if ($smoke.ExitCode -ne 0) {
              throw "Packaged smoke check exited with code $($smoke.ExitCode)"
            }
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            if (Test-Path $uninstaller -PathType Leaf) {
              Start-Process $uninstaller -ArgumentList '/S' -Wait
            }
            Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kizuna-windows-x64-release
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml
            dist/*-notices.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build and smoke-test Linux x64
    needs: validate
    if: needs.validate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install packaging and smoke-test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 pkg-config fakeroot xvfb \
            'mpv=0.37.0-1ubuntu4' 'ffmpeg=7:6.1.1-3ubuntu5'

      - name: Install dependencies
        run: npm ci

      # Same key generation as ci.yml, so a tag built from a commit CI already
      # ran restores the unpacked payload instead of downloading it again.
      - name: Restore pinned binary mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vendor-cache
          key: vendor-v4-linux-x64-${{ hashFiles('resources.lock.json') }}

      - name: Fetch pinned Linux resources
        run: npm run resources -- --platform linux-x64

      - name: Package AppImage and deb
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          npm run dist:linux
          node scripts/validate-update-metadata.mjs dist/latest-linux.yml \
            "kizuna-$VERSION-linux-x86_64.AppImage" "kizuna-$VERSION-linux-amd64.deb"
          tar -czf "dist/kizuna-$VERSION-linux-x64-notices.tar.gz" -C build/notices .

      - name: Verify packaged artifacts
        run: npm run smoke:linux

      - name: Upload Linux release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kizuna-linux-x64-release
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
            dist/*-notices.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload packaging failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packaging-logs
          path: dist/smoke-logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Create draft pre-release
    needs: [validate, build-windows, build-linux]
    if: success() && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kizuna-*-release
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          Kizuna $VERSION is an unsigned x64 pre-release for:

          - Windows 10 or newer: NSIS installer (.exe)
          - Ubuntu 24.04: AppImage and Debian package (.deb)

          The Windows installer and Linux packages are unsigned. Windows may show an unknown-publisher or Microsoft Defender SmartScreen warning.
          Settings and data from the two previous releases upgrade directly. From an older version, first install one of those releases and start it once.
          Packaged smoke tests passed on both platforms. SHA256SUMS.txt covers every downloadable platform asset, and GitHub build provenance is available for each asset.
          EOF

          target=(--target "$TARGET_SHA")
          [[ "$REF_TYPE" == "tag" ]] && target=(--verify-tag)
          gh release create "$TAG" --draft --prerelease --title "$TAG" \
            --notes-file release-notes.md "${target[@]}" dist/*
