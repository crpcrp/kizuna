name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false

      - name: Verify release ref
        id: release
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          build=true
          publish=false

          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Invalid release tag: $REF_NAME" >&2
              exit 1
            fi
            if [[ "$REF_NAME" != "$tag" ]]; then
              echo "Tag $REF_NAME does not match package.json version $version" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo 'The tagged commit is not in main history' >&2
              exit 1
            fi
            publish=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            previous_version=$(git show "$EVENT_BEFORE:package.json" | node -e \
              "let source=''; process.stdin.on('data', chunk => source += chunk); process.stdin.on('end', () => console.log(JSON.parse(source).version))")
            if [[ "$previous_version" == "$version" ]]; then
              echo 'package.json changed without a version change; skipping release build'
              build=false
            else
              lock_version=$(node -p "require('./package-lock.json').version")
              root_lock_version=$(node -p "require('./package-lock.json').packages[''].version")
              if [[ "$lock_version" != "$version" || "$root_lock_version" != "$version" ]]; then
                echo 'package.json and package-lock.json versions do not match' >&2
                exit 1
              fi
              if git rev-parse --verify --quiet "refs/tags/$tag"; then
                echo "Release tag already exists: $tag" >&2
                exit 1
              fi
              publish=true
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build and smoke-test Windows x64
    needs: validate
    if: needs.validate.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Same key generation as ci.yml, so a tag built from a commit CI already
      # ran restores the unpacked payload instead of downloading it again.
      - name: Restore pinned binary mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vendor-cache
          key: vendor-v4-windows-x64-${{ hashFiles('resources.lock.json') }}

      - name: Fetch pinned Windows resources
        run: npm run resources -- --platform win32-x64

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build unsigned installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Verify installer is unsigned
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem dist\*.exe)
          if ($installers.Count -ne 1) {
            throw "Expected one installer, found $($installers.Count)"
          }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned installer, found signature status $($signature.Status)"
          }

      - name: Smoke-test installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem dist\*.exe)[0].FullName
          $installDir = Join-Path $env:RUNNER_TEMP "kizuna-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $appExe = Join-Path $installDir 'kizuna.exe'
          $uninstaller = Join-Path $installDir 'Uninstall Kizuna.exe'

          try {
            $install = Start-Process $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "Installer exited with code $($install.ExitCode)"
            }
            if (-not (Test-Path $appExe -PathType Leaf)) {
              throw "Installed executable is missing: $appExe"
            }

            $env:ELECTRON_RUN_AS_NODE = '1'
            $smoke = Start-Process $appExe `
              -ArgumentList @(
                (Join-Path $installDir 'resources\app.asar\out\main\smoke.js'),
                (Join-Path $installDir 'resources')
              ) `
              -Wait `
              -PassThru `
              -NoNewWindow
            if ($smoke.ExitCode -ne 0) {
              throw "Packaged smoke check exited with code $($smoke.ExitCode)"
            }
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            if (Test-Path $uninstaller -PathType Leaf) {
              Start-Process $uninstaller -ArgumentList '/S' -Wait
            }
            Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create Windows release assets
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installerName = "kizuna-$env:VERSION-setup.exe"
          $blockmapName = "$installerName.blockmap"
          $noticesName = "kizuna-$env:VERSION-windows-x64-notices.zip"
          if (-not (Test-Path "dist\$installerName" -PathType Leaf)) {
            throw "Expected installer is missing: $installerName"
          }
          if (-not (Test-Path "dist\$blockmapName" -PathType Leaf)) {
            throw "Expected NSIS blockmap is missing: $blockmapName"
          }
          if (-not (Test-Path 'dist\latest.yml' -PathType Leaf)) {
            throw 'Expected updater metadata is missing: latest.yml'
          }

          node scripts/validate-update-metadata.mjs dist/latest.yml $installerName

          Compress-Archive -Path build\notices\* -DestinationPath "dist\$noticesName"
          $assetNames = @($installerName, $blockmapName, 'latest.yml', $noticesName)
          $lines = foreach ($name in $assetNames) {
            $asset = Join-Path dist $name
            "$((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower())  $name"
          }
          [System.IO.File]::WriteAllText(
            "$PWD\dist\SHA256SUMS-windows.txt",
            (($lines -join "`n") + "`n"),
            [System.Text.ASCIIEncoding]::new()
          )

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kizuna-windows-x64-release
          path: |
            dist/kizuna-${{ needs.validate.outputs.version }}-setup.exe
            dist/kizuna-${{ needs.validate.outputs.version }}-setup.exe.blockmap
            dist/latest.yml
            dist/kizuna-${{ needs.validate.outputs.version }}-windows-x64-notices.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build and smoke-test Linux x64
    needs: validate
    if: needs.validate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install packaging and smoke-test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 pkg-config fakeroot xvfb \
            'mpv=0.37.0-1ubuntu4' 'ffmpeg=7:6.1.1-3ubuntu5'

      - name: Install dependencies
        run: npm ci

      # Same key generation as ci.yml, so a tag built from a commit CI already
      # ran restores the unpacked payload instead of downloading it again.
      - name: Restore pinned binary mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vendor-cache
          key: vendor-v4-linux-x64-${{ hashFiles('resources.lock.json') }}

      - name: Fetch pinned Linux resources
        run: npm run resources -- --platform linux-x64

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Package AppImage and deb
        run: npm run dist:linux

      - name: Verify packaged artifacts
        run: npm run smoke:linux

      - name: Create Linux release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          appimage="kizuna-$VERSION-linux-x86_64.AppImage"
          deb="kizuna-$VERSION-linux-amd64.deb"
          notices="kizuna-$VERSION-linux-x64-notices.tar.gz"

          [[ -f "dist/$appimage" ]] || { echo "Missing $appimage" >&2; exit 1; }
          [[ -f "dist/$deb" ]] || { echo "Missing $deb" >&2; exit 1; }
          [[ -f dist/latest-linux.yml ]] || { echo "Missing latest-linux.yml" >&2; exit 1; }
          node scripts/validate-update-metadata.mjs dist/latest-linux.yml "$appimage" "$deb"
          tar -czf "dist/$notices" -C build/notices .
          (
            cd dist
            sha256sum "$appimage" "$deb" latest-linux.yml "$notices" > SHA256SUMS-linux.txt
            sha256sum --check --strict SHA256SUMS-linux.txt
          )

      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kizuna-linux-x64-release
          path: |
            dist/kizuna-${{ needs.validate.outputs.version }}-linux-x86_64.AppImage
            dist/kizuna-${{ needs.validate.outputs.version }}-linux-amd64.deb
            dist/latest-linux.yml
            dist/kizuna-${{ needs.validate.outputs.version }}-linux-x64-notices.tar.gz
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload packaging failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packaging-logs
          path: dist/smoke-logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Create draft pre-release
    needs: [validate, build-windows, build-linux]
    if: success() && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kizuna-windows-x64-release
          path: artifacts/windows

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kizuna-linux-x64-release
          path: artifacts/linux

      - name: Verify and combine release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          windows_assets=(
            "kizuna-$VERSION-setup.exe"
            "kizuna-$VERSION-setup.exe.blockmap"
            "latest.yml"
            "kizuna-$VERSION-windows-x64-notices.zip"
          )
          linux_assets=(
            "kizuna-$VERSION-linux-x86_64.AppImage"
            "kizuna-$VERSION-linux-amd64.deb"
            "latest-linux.yml"
            "kizuna-$VERSION-linux-x64-notices.tar.gz"
          )

          verify_platform() {
            local directory=$1
            local manifest=$2
            shift 2
            local expected=("$@")
            local actual manifest_entries

            mapfile -t actual < <(find "$directory" -maxdepth 1 -type f -printf '%f\n' | sort)
            mapfile -t expected_with_manifest < <(printf '%s\n' "${expected[@]}" "$manifest" | sort)
            if [[ "${actual[*]}" != "${expected_with_manifest[*]}" ]]; then
              echo "Unexpected files in $directory" >&2
              printf 'Expected: %s\nActual: %s\n' "${expected_with_manifest[*]}" "${actual[*]}" >&2
              exit 1
            fi

            mapfile -t manifest_entries < <(
              sed -nE 's/^[0-9a-f]{64}  ([^/]+)$/\1/p' "$directory/$manifest" | sort
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            if [[ "${manifest_entries[*]}" != "${expected_sorted[*]}" ]]; then
              echo "$manifest does not cover exactly the expected assets" >&2
              exit 1
            fi
            if [[ "${#manifest_entries[@]}" -ne "$(wc -l < "$directory/$manifest")" ]]; then
              echo "$manifest contains an invalid checksum entry" >&2
              exit 1
            fi
            (cd "$directory" && sha256sum --check --strict "$manifest")
          }

          verify_platform artifacts/windows SHA256SUMS-windows.txt "${windows_assets[@]}"
          verify_platform artifacts/linux SHA256SUMS-linux.txt "${linux_assets[@]}"

          mapfile -t duplicate_names < <(
            printf '%s\n' "${windows_assets[@]}" "${linux_assets[@]}" | sort | uniq -d
          )
          if [[ "${#duplicate_names[@]}" -ne 0 ]]; then
            echo "Duplicate release asset names: ${duplicate_names[*]}" >&2
            exit 1
          fi

          mkdir dist
          for name in "${windows_assets[@]}"; do cp "artifacts/windows/$name" dist/; done
          for name in "${linux_assets[@]}"; do cp "artifacts/linux/$name" dist/; done
          all_assets=("${windows_assets[@]}" "${linux_assets[@]}")
          (cd dist && sha256sum "${all_assets[@]}" > SHA256SUMS.txt)
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          Kizuna $VERSION is an unsigned x64 pre-release for:

          - Windows 10 or newer: NSIS installer (.exe)
          - Ubuntu 24.04: AppImage and Debian package (.deb)

          The Windows installer and Linux packages are unsigned. Windows may show an unknown-publisher or Microsoft Defender SmartScreen warning.
          Automated checks and packaged smoke tests passed on both platforms. SHA256SUMS.txt covers every downloadable platform asset, and GitHub build provenance is available for each asset.
          EOF

          args=(
            release create "$TAG"
            --draft
            --prerelease
            --title "$TAG"
            --notes-file release-notes.md
          )
          if [[ "$REF_TYPE" == "tag" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$TARGET_SHA")
          fi
          gh "${args[@]}" \
            dist/*.exe \
            dist/*.blockmap \
            dist/*.AppImage \
            dist/*.deb \
            dist/*.yml \
            dist/*-notices.zip \
            dist/*-notices.tar.gz \
            dist/SHA256SUMS.txt
