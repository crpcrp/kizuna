name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      create_release:
        description: Create the version tag and a draft pre-release
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned installer
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify release ref
        id: release
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"

          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
              throw "Invalid release tag: $env:REF_NAME"
            }
            if ($env:REF_NAME -ne $tag) {
              throw "Tag $env:REF_NAME does not match package.json version $version"
            }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) {
              throw 'The tagged commit is not in main history'
            }
          } elseif ($env:REF_NAME -ne 'main') {
            throw 'Manual release builds must run from main'
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Fetch pinned runtime binaries
        run: npm run resources

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build unsigned installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Verify installer is unsigned
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem dist\*.exe)
          if ($installers.Count -ne 1) {
            throw "Expected one installer, found $($installers.Count)"
          }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned installer, found signature status $($signature.Status)"
          }

      - name: Smoke-test installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem dist\*.exe)[0].FullName
          $installDir = Join-Path $env:RUNNER_TEMP "kizuna-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $appExe = Join-Path $installDir 'kizuna.exe'
          $uninstaller = Join-Path $installDir 'Uninstall Kizuna.exe'

          try {
            $install = Start-Process $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "Installer exited with code $($install.ExitCode)"
            }
            if (-not (Test-Path $appExe -PathType Leaf)) {
              throw "Installed executable is missing: $appExe"
            }

            $env:ELECTRON_RUN_AS_NODE = '1'
            $smoke = Start-Process $appExe `
              -ArgumentList @(
                (Join-Path $installDir 'resources\app.asar\out\main\smoke.js'),
                (Join-Path $installDir 'resources')
              ) `
              -Wait `
              -PassThru `
              -NoNewWindow
            if ($smoke.ExitCode -ne 0) {
              throw "Packaged smoke check exited with code $($smoke.ExitCode)"
            }
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            if (Test-Path $uninstaller -PathType Leaf) {
              Start-Process $uninstaller -ArgumentList '/S' -Wait
            }
            Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          Compress-Archive -Path build\notices\* -DestinationPath "dist\kizuna-$env:VERSION-notices.zip"
          $assets = Get-ChildItem dist\*.exe, dist\*-notices.zip | Sort-Object Name
          $lines = foreach ($asset in $assets) {
            "$((Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLower())  $($asset.Name)"
          }
          [System.IO.File]::WriteAllText(
            "$PWD\dist\SHA256SUMS.txt",
            (($lines -join "`n") + "`n"),
            [System.Text.ASCIIEncoding]::new()
          )

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kizuna-windows-release
          path: |
            dist/*.exe
            dist/*-notices.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # Linux x64 packaging and its packaged smoke test. Deliberately part of the
  # release workflow rather than per-commit CI: it is minutes of electron-builder
  # plus a real Electron launch under a virtual X server, and a pull request
  # should still run exactly the CI and CodeQL checks branch protection
  # requires. `test/linuxPackagingConfig.test.ts` runs in ordinary CI and
  # catches configuration drift long before this job does.
  #
  # The artifacts are verified and uploaded but not attached to the draft
  # release: Linux publishing is enabled separately (see docs/releasing.md).
  build-linux:
    name: Package and smoke-test Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # The documented Linux build toolchain, plus what the packaged smoke test
      # itself needs. `xvfb` provides the virtual X server mpv's `--wid`
      # embedding requires; `fakeroot` is fpm's unprivileged packaging helper.
      #
      # mpv and ffmpeg are installed at the exact versions the deb depends on:
      # the bundled executables are unmodified files from those Ubuntu packages
      # and load their shared libraries from them (see the vendor mirror's
      # LINUX_X64_DEPENDENCIES.md). Installing them here is also what lets the
      # AppImage run at all, since it bundles no such libraries.
      - name: Install packaging and smoke-test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential python3 pkg-config fakeroot xvfb \
            'mpv=0.37.0-1ubuntu4' 'ffmpeg=7:6.1.1-3ubuntu5'

      - name: Install dependencies
        run: npm ci

      - name: Fetch pinned runtime binaries
        run: npm run resources

      - name: Package AppImage and deb
        run: npm run dist:linux

      # Installs and uninstalls the deb, runs the AppImage from a clean
      # directory, and starts the real application under Xvfb with an isolated
      # user-data directory. No network, no accounts, and the only media is a
      # fixture the script generates with the freshly packaged ffmpeg.
      - name: Verify packaged artifacts
        run: npm run smoke:linux

      - name: Record artifact checksums
        run: |
          cd dist
          sha256sum ./*.AppImage ./*.deb > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kizuna-linux-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14

      # The smoke test writes one file per failed check, each carrying the
      # app's and mpv's stderr and the milestones the launch did reach — enough
      # to tell an Electron, mpv, dependency, sandbox, or display failure apart.
      - name: Upload packaging failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packaging-logs
          path: dist/smoke-logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Create draft pre-release
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kizuna-windows-release
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ needs.build.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          Kizuna $VERSION is an unsigned Windows pre-release.

          Automated checks, packaged smoke tests, checksums, and build provenance passed.
          Windows will show an unknown-publisher warning and may display Microsoft Defender SmartScreen.
          EOF

          args=(
            release create "$TAG"
            --draft
            --prerelease
            --title "$TAG"
            --notes-file release-notes.md
          )
          if [[ "$REF_TYPE" == "tag" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$TARGET_SHA")
          fi
          gh "${args[@]}" dist/*.exe dist/SHA256SUMS.txt dist/*-notices.zip
